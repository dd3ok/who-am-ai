spring:
  application:
    name: who-am-ai
  mongodb:
    uri: ${MONGO_URI:}
  ai:
    model:
      chat: openai
      # OpenAI and Google use separate selectors; keep only Gemini text embeddings.
      embedding: none
      embedding.text: google-genai
    openai:
      base-url: https://generativelanguage.googleapis.com/v1beta/openai
      api-key: ${GEMINI_API_KEY}
      timeout: 110s
      max-retries: 0
      chat:
        model: gemini-3.8-flash
        reasoning-effort: medium
        max-tokens: 8192
    google:
      genai:
        # Embedding 2 uses retrieval prefixes in API inputs and a separate Atlas collection.
        api-key: ${GEMINI_EMBEDDING_API_KEY:${GEMINI_API_KEY:}}
        embedding:
          api-key: ${spring.ai.google.genai.api-key}
          text:
            model: gemini-embedding-2
            dimensions: 768
    vectorstore:
      mongodb:
        initialize-schema: false
        collection-name: resume_chunks_embedding2
        index-name: vector_index
        path-name: embedding
        metadata-fields-to-filter: company,skills

server:
  port: ${PORT:8080}

logging:
  level:
    root: WARN
    org.springframework: WARN
    com.dd3ok.whoamai: debug

management:
  health:
    mongodb:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

admin:
  api-key: ${ADMIN_API_KEY:}

chat-access:
  session-lifetime-seconds: 86400
  sessions-per-ip-per-minute: 5
  sessions-per-minute: 60
  messages-per-session-per-minute: 10
  messages-per-ip-per-minute: 30
  messages-per-ip-per-day: 150
  messages-per-minute: 120
  block-violation-threshold: 5
  block-violation-window-seconds: 300
  block-duration-seconds: 900
  trusted-proxy-hops: 1

websocket:
  allow-null-origin: false
  max-message-bytes: 65536
  max-content-length: 4000
  max-uuid-length: 128
  response-timeout-ms: 120000
  allowed-origins:
    - https://dd3ok.github.io
    - http://localhost:3000

prompts:
  system-path: classpath:prompts/system.st
  routing-instruction-path: classpath:prompts/routing-instruction.st
  routing-template-path: classpath:prompts/routing-template.st
  rag-template-path: classpath:prompts/rag-template.st
  conversational-template-path: classpath:prompts/conversational-template.st

rag:
  search:
    metadata-filter-enabled: true
    similarity-threshold: 0.65

who-am-ai:
  ai:
    chat:
      # The existing streaming adapter applies these options to the configured Spring AI provider.
      # https://ai.google.dev/gemini-api/docs/openai#thinking
      models: [gemini-3.8-flash]
      reasoning-effort: medium
      selector-reasoning-effort: low
      max-output-tokens: 8192
      rate-limit-cooldown-ms: 60000
    decision:
      enabled: true
      base-url: https://generativelanguage.googleapis.com/v1beta
      api-key: ${GEMINI_DECISION_API_KEY:${spring.ai.openai.api-key:}}
      model: gemini-decision-1
      timeout-ms: 5000
      topic-confidence-threshold: 0.55
      chunk-noul-threshold: 0.50
      chunk-fallback-noul-threshold: 0.35
      chunk-high-confidence-rescue-threshold: 0.85
      max-selected-chunks: 8
    cache:
      enabled: true
      ttl-seconds: 604800
      max-in-memory-entries: 128
      initial-delay-min-ms: 450
      initial-delay-max-ms: 700
      target-stream-duration-ms: 1600
      chunk-delay-min-ms: 18
      chunk-delay-max-ms: 32
      pause-delay-ms: 60
